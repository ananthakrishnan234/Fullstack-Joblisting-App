# ?????????????????????????????????????????
# Server
# ?????????????????????????????????????????
server.port=8081

# ?????????????????????????????????????????
# MongoDB
# ?????????????????????????????????????????
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=${MONGO_DATABASE:jobapidb}

# ?????????????????????????????????????????
# JWT Configuration
# Generate a strong secret: any 256-bit base64 string
# ?????????????????????????????????????????
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ?????????????????????????????????????????
# OpenAPI / Swagger UI
# ?????????????????????????????????????????
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ?????????????????????????????????????????
# Anthropic Claude API
# ?????????????????????????????????????????
anthropic.api.key=${ANTHROPIC_API_KEY:}

# ?????????????????????????????????????????
# Logging
# ?????????????????????????????????????????
logging.level.com.example.joblisting=INFO
logging.level.org.springframework.security=INFO